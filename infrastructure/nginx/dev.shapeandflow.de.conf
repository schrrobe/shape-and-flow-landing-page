# Dev. Wortgleich zu stage.shapeandflow.de.conf, nur mit eigenem Port und Upstream-Namen; die
# Begründungen für Basic Auth, X-Robots-Tag und die acme-challenge-Location stehen dort.
#
# Diese Umgebung bekommt, was auf `fusion` liegt — das ist ausdrücklich unfertiger Stand.
#
# Wird von infrastructure/provision.sh nach /etc/nginx/sites-available/dev.shapeandflow.de
# gelegt.

upstream sf_landing_dev {
  server 127.0.0.1:8092;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name dev.shapeandflow.de;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 308 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name dev.shapeandflow.de;

  ssl_certificate     /etc/letsencrypt/live/dev.shapeandflow.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dev.shapeandflow.de/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000" always;
  server_tokens off;

  client_max_body_size 64k;

  access_log /var/log/nginx/landing_dev.access.log;
  error_log  /var/log/nginx/landing_dev.error.log warn;

  location / {
    auth_basic           "dev.shapeandflow.de";
    auth_basic_user_file /etc/nginx/.htpasswd;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_pass http://sf_landing_dev;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Überschreiben, nicht anhängen — Begründung im Produktions-Vhost.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Accept-Encoding   $http_accept_encoding;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
}
