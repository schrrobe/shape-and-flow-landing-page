# Staging. Identisch zur Produktion bis auf drei Dinge: anderer Upstream-Port, Basic Auth und
# X-Robots-Tag.
#
# Zwei Schutzschichten gegen Indexierung, weil jede für sich Lücken hat: der Build setzt
# NUXT_SITE_ENV=staging, was `Disallow: /` in die robots.txt schreibt — das ist eine Bitte, kein
# Zwang. X-Robots-Tag ist verbindlich, wird aber nur gelesen, wenn die Seite überhaupt abgeholt
# wird. Basic Auth verhindert genau das.
#
# Wird von infrastructure/provision.sh nach /etc/nginx/sites-available/stage.shapeandflow.de
# gelegt.

upstream sf_landing_stage {
  # Der Name muss sich von den anderen Umgebungen unterscheiden. Zwei Vhosts mit gleich
  # benanntem upstream-Block teilen sich stillschweigend einen Pool, und dann landen Anfragen
  # an stage in dev.
  server 127.0.0.1:8091;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name stage.shapeandflow.de;

  # Muss außerhalb der Basic-Auth-Location bleiben und vor der Weiterleitung stehen. Sonst
  # gelingt die erste Ausstellung noch von Hand, und die automatische Verlängerung scheitert
  # 90 Tage später still.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 308 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name stage.shapeandflow.de;

  ssl_certificate     /etc/letsencrypt/live/stage.shapeandflow.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/stage.shapeandflow.de/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000" always;
  server_tokens off;

  client_max_body_size 64k;

  access_log /var/log/nginx/landing_stage.access.log;
  error_log  /var/log/nginx/landing_stage.error.log warn;

  location / {
    auth_basic           "stage.shapeandflow.de";
    auth_basic_user_file /etc/nginx/.htpasswd;

    add_header X-Robots-Tag "noindex, nofollow" always;
    # nginx erbt add_header von der äußeren Ebene nur so lange, wie die innere selbst keines
    # setzt. Die Zeile darüber setzt eines, damit fällt HSTS aus der Server-Ebene hier weg und
    # muss wiederholt werden.
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_pass http://sf_landing_stage;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Überschreiben, nicht anhängen — Begründung im Produktions-Vhost.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Accept-Encoding   $http_accept_encoding;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
}
