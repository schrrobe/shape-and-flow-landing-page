# Produktion. Der einzige Prozess auf der Maschine, der am öffentlichen Interface lauscht, ist
# dieses nginx; der Nuxt-Container hängt an 127.0.0.1:8090 und ist von außen nicht erreichbar.
#
# Wird von infrastructure/provision.sh nach /etc/nginx/sites-available/shapeandflow.de gelegt.

upstream sf_landing_production {
  server 127.0.0.1:8090;

  # Ein Pool offener Verbindungen, damit nicht jede Anfrage einen TCP-Handshake bezahlt.
  # Setzt proxy_http_version 1.1 und den leeren Connection-Header weiter unten voraus.
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name shapeandflow.de www.shapeandflow.de;

  # Certbot legt seine Challenge hier ab und muss sie über einfaches HTTP beantworten können,
  # deshalb steht diese Location vor der Weiterleitung.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 308 https://$host$request_uri;
  }
}

# www bekommt einen eigenen Block statt einer server_name-Zeile mit beiden Namen: nur so lässt
# sich die Weiterleitung auf die Apex-Domain aussprechen, die Canonicals, Sitemap und
# Structured Data ohnehin schon behaupten. Zwei erreichbare Hostnamen mit identischem Inhalt
# wären genau der Duplicate-Content, den die SEO-Konfiguration vermeiden soll.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name www.shapeandflow.de;

  ssl_certificate     /etc/letsencrypt/live/shapeandflow.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shapeandflow.de/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000" always;
  server_tokens off;

  return 301 https://shapeandflow.de$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name shapeandflow.de;

  ssl_certificate     /etc/letsencrypt/live/shapeandflow.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shapeandflow.de/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Kein includeSubDomains: das würde auch buchung.shapeandflow.de binden, und die Booking-App
  # führt ihre eigene Zertifikatspolitik. Dieselbe Begründung stand schon im vorherigen Vhost.
  add_header Strict-Transport-Security "max-age=31536000" always;
  server_tokens off;

  # Die einzige Eingabe ist das Kontaktformular, und dessen längstes Feld sind 3000 Zeichen.
  # Ein knapper Body-Limit kostet nichts und schneidet alles ab, was hier nichts zu suchen hat.
  client_max_body_size 64k;

  access_log /var/log/nginx/landing_production.access.log;
  error_log  /var/log/nginx/landing_production.error.log warn;

  location / {
    proxy_pass http://sf_landing_production;

    proxy_http_version 1.1;
    # Ohne diese Zeile schickt nginx `Connection: close` und der keepalive-Pool oben bleibt
    # ungenutzt.
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # $remote_addr statt $proxy_add_x_forwarded_for: dieses nginx ist der erste Empfänger, es
    # steht kein CDN und kein zweiter Proxy davor. $proxy_add_x_forwarded_for würde einen vom
    # Client mitgeschickten X-Forwarded-For übernehmen und die echte Adresse dahinter hängen —
    # und die Frequenzgrenze in server/api/kontakt.post.ts liest den ersten Eintrag der Liste.
    # Damit könnte jeder das Limit umgehen, indem er den Header bei jeder Anfrage anders setzt.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Nitro liefert die vorkomprimierten .br-/.gz-Dateien aus, die der Build erzeugt hat
    # (compressPublicAssets in nuxt.config.ts). Dafür muss Accept-Encoding unverändert
    # durchgereicht werden — nginx tut das per Voreinstellung, solange hier nichts anderes
    # steht. Deshalb auch kein `gzip on` in diesem Block: es würde bereits komprimierte
    # Antworten ein zweites Mal anfassen.
    proxy_set_header Accept-Encoding $http_accept_encoding;

    # Der Container startet in wenigen Sekunden; hängt er länger, ist ein 504 die ehrlichere
    # Antwort als eine offene Verbindung.
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
}
