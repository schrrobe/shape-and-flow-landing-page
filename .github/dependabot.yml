# Updates laufen gegen main, weil von dort aus released wird.
#
# Das Commit-Präfix ist nicht Kosmetik: der neue Job "Commit-Konvention" in ci.yml prüft auch
# Dependabot-PRs, und release-please sortiert `chore` unter "Miscellaneous" statt in die
# Feature-Liste.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # Minor und Patch in einer PR. Einzeln wären das jede Woche ein Dutzend, die alle denselben
      # Review bekämen: CI grün, Seite baut.
      minor-und-patch:
        update-types:
          - minor
          - patch
    # Majors bleiben ungruppiert. Ein Nuxt- oder Tailwind-Sprung gehört einzeln angesehen, nicht
    # zwischen zwanzig Patchbumps versteckt.
    ignore:
      # TypeScript 7 ist der native Port und exportiert die internen Enums nicht mehr, auf die
      # ts-api-utils zugreift. Dadurch stirbt ESLint schon beim Laden des Moduls:
      # "TypeError: Cannot read properties of undefined (reading 'Intrinsic')".
      # @typescript-eslint (via @nuxt/eslint) verlangt aktuell typescript <6.1.0, selbst
      # ts-api-utils 3.0.0-rc.1 verlangt <7. Der Bump kommt zurück, sobald typescript-eslint
      # TypeScript 7 unterstützt – dann diese Regel entfernen.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # Hält die per Commit-SHA gepinnten Actions in ci.yml und deploy.yml aktuell. Dependabot
  # aktualisiert dabei den SHA und den Versionskommentar dahinter.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(deps)'
    groups:
      actions:
        update-types:
          - minor
          - patch
