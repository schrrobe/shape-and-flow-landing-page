name: Deploy

# Builds the image on the runner, pushes it to GHCR and restarts the target environment over SSH.
# Nothing is built on the server; there is not even Node installed there.
#
# Called by ci.yml as soon as the checks are green. By hand for a redeploy, a first start or a
# rollback:
#
#     gh workflow run deploy.yml -f env_name=stage
#     gh workflow run deploy.yml -f env_name=production -f image_tag=<older tag>
#
# Dev can be deployed from any branch — that is what the environment is there for:
#
#     gh workflow run deploy.yml --ref my-branch -f env_name=dev
#
# Stage and production cannot; see the gate in the `prepare` job.
#
# ── Where the configuration comes from ──────────────────────────────────────
#
#   vars.DEPLOY_HOST        address of the server
#   vars.DEPLOY_USER        `deploy` — no sudo, member of the docker group
#   vars.SSH_KNOWN_HOSTS    the host key of the server. Deliberately a *variable* and not a
#                           secret: the information is public, and as a secret it would be
#                           masked to `***` in exactly those log lines one has to read when
#                           SSH fails.
#   secrets.SSH_PRIVATE_KEY repository secret, a key for this workflow only.
#
# There is no single ENV_FILE secret here as in the booking stack. The few secrets this site does
# have — the SMTP password and the Unleash backend token — come from the GitHub environment, and
# everything else the server needs to know — image tag, port, stack name — is written down below
# in this workflow. Both are written to the server at deploy time.

on:
  workflow_call:
    inputs:
      env_name:
        description: dev, stage or production
        required: true
        type: string
      image_tag:
        description: Deploy an existing tag instead of building this commit
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      env_name:
        description: Environment
        required: true
        type: choice
        # dev first, so that the button offers it as the default.
        options: [dev, stage, production]
        default: dev
      image_tag:
        description: Deploy an existing tag (empty = build this commit)
        required: false
        type: string
        default: ''

jobs:
  # Everything the later jobs need, worked out once. The mapping environment → hostname → port
  # therefore lives in exactly one place in the repository; nginx on the server knows the same
  # ports, see infrastructure/nginx/.
  prepare:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.values.outputs.owner }}
      tag: ${{ steps.values.outputs.tag }}
      site_url: ${{ steps.values.outputs.site_url }}
      site_env: ${{ steps.values.outputs.site_env }}
      port: ${{ steps.values.outputs.port }}
    steps:
      # Checked here and not only in the deploy job, so that the abort comes before an image has
      # been built.
      #
      # Dev may come from any branch. Stage and production may not: those are the environments
      # `main` produces, and a manually triggered deploy from a feature branch would put
      # unchecked code behind hostnames that everyone reads as "this is main". The branch policy
      # of the GitHub environments enforces the same thing; this step makes the rejection
      # readable instead of leaving a blocked job without a reason.
      - name: Stage and production only from main
        if: ${{ (inputs.env_name == 'stage' || inputs.env_name == 'production') && github.ref_name != 'main' }}
        env:
          REF: ${{ github.ref_name }}
          ENV_NAME: ${{ inputs.env_name }}
        run: |
          echo "Deploy of $ENV_NAME from '$REF' rejected." >&2
          echo "Merge into main, or try this branch out with env_name=dev." >&2
          exit 1

      - id: values
        env:
          OWNER: ${{ github.repository_owner }}
          ENV_NAME: ${{ inputs.env_name }}
          # A tag passed in wins: then this is a rollback and the build is skipped. Otherwise
          # the commit that was checked gets deployed.
          TAG: ${{ inputs.image_tag != '' && inputs.image_tag || format('{0}-{1}', github.sha, inputs.env_name) }}
        run: |
          set -euo pipefail

          # GHCR rejects upper case in the path; GitHub account names are allowed to contain it.
          printf 'owner=%s\n' "${OWNER,,}" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

          # NUXT_SITE_ENV drives the robots.txt: everything other than "production" serves
          # Disallow: /. The site URL is baked into the HTML during prerendering, which is why
          # every environment gets an image of its own — see docs/deploy.md.
          case "$ENV_NAME" in
            production) url=https://shapeandflow.de       ; site_env=production ; port=8090 ;;
            stage)      url=https://stage.shapeandflow.de ; site_env=staging    ; port=8091 ;;
            dev)        url=https://dev.shapeandflow.de   ; site_env=staging    ; port=8092 ;;
            *) echo "Unknown environment: $ENV_NAME" >&2; exit 1 ;;
          esac

          printf 'site_url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          printf 'site_env=%s\n' "$site_env" >> "$GITHUB_OUTPUT"
          printf 'port=%s\n' "$port" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push image
    needs: [prepare]
    # Skipped on a rollback: the image for the named tag is already in the registry, and
    # rebuilding it would defeat the very purpose of naming a known state.
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # `packages: write` above is the permission, not the login. Without this step the push
      # fails with "unauthorized" after the whole build has already been paid for.
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          # linux/amd64 spelled out: sharp and the OG renderer put native binaries into the
          # image, and the VPS is x86_64. An image built for arm64 by accident does not start
          # there.
          platforms: linux/amd64
          build-args: |
            NUXT_SITE_URL=${{ needs.prepare.outputs.site_url }}
            NUXT_SITE_ENV=${{ needs.prepare.outputs.site_env }}
          # Two tags: the immutable one carrying the commit, which a rollback can hold on to,
          # and the moving one, which shows what is currently running in an environment.
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner }}/sf-landing:${{ needs.prepare.outputs.tag }}
            ghcr.io/${{ needs.prepare.outputs.owner }}/sf-landing:${{ inputs.env_name }}
          # Separate per environment, otherwise the three builds evict each other's layers.
          cache-from: type=gha,scope=${{ inputs.env_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.env_name }}
          provenance: false

  deploy:
    name: Deploy to ${{ inputs.env_name }}
    needs: [prepare, build]
    # `always()` is needed because `build` is skipped on a rollback, and a skipped dependency
    # would otherwise skip this job along with it. The result check still keeps a failed build
    # from being deployed.
    if: ${{ always() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    # This is where the branch policy and any required approval of the environment take hold.
    environment:
      name: ${{ inputs.env_name }}
      url: ${{ needs.prepare.outputs.site_url }}
    permissions:
      contents: read
      packages: read
    # cancel-in-progress has to stay false: a deploy aborted between `pull` and `up` leaves a
    # half-replaced directory behind.
    concurrency:
      group: deploy-landing-${{ inputs.env_name }}
      cancel-in-progress: false
    env:
      DIR: /opt/landing/${{ inputs.env_name }}
      ENV_NAME: ${{ inputs.env_name }}
      IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
      GHCR_OWNER: ${{ needs.prepare.outputs.owner }}
      WEB_PUBLISH_PORT: ${{ needs.prepare.outputs.port }}
      # A login directory of its own per environment. The concurrency group separates by
      # environment only, so dev and stage can deploy at the same time — both as the user
      # `deploy` on the same machine. With the default path ~/.docker/config.json, the
      # `docker logout` of one deploy would pull the login out from under the other.
      REMOTE_DOCKER_CONFIG: /opt/landing/${{ inputs.env_name }}/.docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > /tmp/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > /tmp/deploy_known_hosts
          cat > /tmp/ssh_config <<EOF
          Host landing
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile /tmp/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile /tmp/deploy_known_hosts
            BatchMode yes
            ConnectTimeout 15
          EOF
          # A real known_hosts entry, not StrictHostKeyChecking=no. The alternative trusts
          # whatever answers on port 22, and that is the entire protection gone.
          ssh -F /tmp/ssh_config landing 'echo "connected as $(id -un) on $(hostname)"'

      - name: Upload compose file
        run: |
          set -euo pipefail
          # Copied at deploy time instead of checked out on the server: that way the compose
          # file always matches the commit being deployed, and the server needs neither git nor
          # any access to the repository.
          scp -F /tmp/ssh_config docker-compose.prod.yml "landing:$DIR/"

      - name: Write environment file
        env:
          # The outgoing mail server for the contact form. Host, port, user and the two
          # addresses are not secrets and are therefore variables of the environment; only the
          # password is a secret. If one of the values is missing, the entry stays empty and the
          # form answers with a pointer to the email address — the deploy does not fail over it.
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_ABSENDER: ${{ vars.SMTP_ABSENDER }}
          SMTP_EMPFAENGER: ${{ vars.SMTP_EMPFAENGER }}
          # Separate per GitHub environment. Only the backend token is secret; the frontend
          # token is a deliberately public, read-only SDK credential.
          UNLEASH_BASE_URL: ${{ vars.UNLEASH_URL }}
          UNLEASH_BACKEND_TOKEN: ${{ secrets.UNLEASH_BACKEND_TOKEN }}
          UNLEASH_FRONTEND_TOKEN: ${{ vars.UNLEASH_FRONTEND_TOKEN }}
          UNLEASH_ENVIRONMENT: ${{ vars.UNLEASH_ENVIRONMENT }}
          UNLEASH_DEPLOYMENT: ${{ vars.UNLEASH_DEPLOYMENT }}
        run: |
          set -euo pipefail
          : "${UNLEASH_BASE_URL:?UNLEASH_URL missing in the GitHub environment}"
          : "${UNLEASH_BACKEND_TOKEN:?UNLEASH_BACKEND_TOKEN missing in the GitHub environment}"
          : "${UNLEASH_FRONTEND_TOKEN:?UNLEASH_FRONTEND_TOKEN missing in the GitHub environment}"
          : "${UNLEASH_ENVIRONMENT:?UNLEASH_ENVIRONMENT missing in the GitHub environment}"
          : "${UNLEASH_DEPLOYMENT:?UNLEASH_DEPLOYMENT missing in the GitHub environment}"
          unleash_base="${UNLEASH_BASE_URL%/}"
          # STACK_SUFFIX has to sit in the file and not merely be exported: compose resolves
          # ${…} in the project name from --env-file, not from the shell.
          #
          # umask 077 on the far side, so the file is 600 from the first moment on. The SMTP
          # password is in this file, so nobody else may be able to read it.
          {
            printf 'STACK_SUFFIX=%s\n'        "$ENV_NAME"
            printf 'IMAGE_TAG=%s\n'           "$IMAGE_TAG"
            printf 'GHCR_OWNER=%s\n'          "$GHCR_OWNER"
            printf 'WEB_PUBLISH_PORT=%s\n'    "$WEB_PUBLISH_PORT"
            printf 'NUXT_SMTP_HOST=%s\n'      "${SMTP_HOST:-}"
            printf 'NUXT_SMTP_PORT=%s\n'      "${SMTP_PORT:-587}"
            printf 'NUXT_SMTP_USER=%s\n'      "${SMTP_USER:-}"
            printf 'NUXT_SMTP_PASSWORD=%s\n'  "${SMTP_PASSWORD:-}"
            # These two only when set: to Nitro an empty assignment is a value and would
            # overwrite the addresses from shared/site.ts rather than leave them open.
            [ -n "${SMTP_ABSENDER:-}" ]   && printf 'NUXT_SMTP_ABSENDER=%s\n'   "$SMTP_ABSENDER"
            [ -n "${SMTP_EMPFAENGER:-}" ] && printf 'NUXT_SMTP_EMPFAENGER=%s\n' "$SMTP_EMPFAENGER"
            printf 'NUXT_UNLEASH_URL=%s/api/\n'                    "$unleash_base"
            printf 'NUXT_UNLEASH_BACKEND_TOKEN=%s\n'              "$UNLEASH_BACKEND_TOKEN"
            printf 'NUXT_UNLEASH_ENVIRONMENT=%s\n'                "$UNLEASH_ENVIRONMENT"
            printf 'NUXT_UNLEASH_DEPLOYMENT=%s\n'                 "$UNLEASH_DEPLOYMENT"
            printf 'NUXT_PUBLIC_UNLEASH_URL=%s/api/frontend\n'    "$unleash_base"
            printf 'NUXT_PUBLIC_UNLEASH_FRONTEND_TOKEN=%s\n'      "$UNLEASH_FRONTEND_TOKEN"
            printf 'NUXT_PUBLIC_UNLEASH_ENVIRONMENT=%s\n'         "$UNLEASH_ENVIRONMENT"
            printf 'NUXT_PUBLIC_UNLEASH_DEPLOYMENT=%s\n'          "$UNLEASH_DEPLOYMENT"
            # Without this the block would end with the return value of the last [ ], and
            # `set -e` aborts as soon as both variables are empty.
            true
          } | ssh -F /tmp/ssh_config landing "umask 077 && cat > '$DIR/.env.$ENV_NAME'"
          # Only the permissions and the key names, not the contents: otherwise the password
          # would stand in the action log.
          ssh -F /tmp/ssh_config landing \
            "ls -l '$DIR/.env.$ENV_NAME' && cut -d= -f1 '$DIR/.env.$ENV_NAME' \
             | grep -v '^NUXT_UNLEASH_BACKEND_TOKEN$'"

      - name: Log in to GHCR on the server
        env:
          # This run's own token, not a stored PAT: it may read the packages of this repository
          # and expires with the job. So no permanent registry login is left lying around on the
          # server.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | ssh -F /tmp/ssh_config landing \
                "mkdir -p '$REMOTE_DOCKER_CONFIG' && chmod 700 '$REMOTE_DOCKER_CONFIG' \
                 && DOCKER_CONFIG='$REMOTE_DOCKER_CONFIG' docker login ghcr.io -u '$ACTOR' --password-stdin"

      - name: Pull and start
        run: |
          set -euo pipefail
          # The assignments in front of `bash` are substituted here on the runner and end up in
          # the environment of the remote shell. The heredoc body is quoted and reaches the
          # server unchanged.
          # shellcheck disable=SC2029
          ssh -F /tmp/ssh_config landing \
            "DIR='$DIR' ENV_NAME='$ENV_NAME' DOCKER_CONFIG='$REMOTE_DOCKER_CONFIG' bash -euo pipefail -s" <<'REMOTE_SCRIPT'
          cd "$DIR"
          COMPOSE="docker compose --env-file .env.$ENV_NAME -f docker-compose.prod.yml"

          echo "==> pull"
          $COMPOSE pull

          echo "==> up"
          # --wait waits for the HEALTHCHECK from the Dockerfile, not merely for the process to
          # exist.
          $COMPOSE up -d --wait

          echo "==> clean up"
          # The replaced image keeps its tag and therefore does not count as "dangling" — a bare
          # `docker image prune` would never touch it, and after a few dozen deploys that adds up
          # to several gigabytes. With -a and the label filter it hits exactly those landing
          # images no container uses any more; the running environments and the booking stack on
          # the same machine stay untouched.
          docker image prune -af --filter 'label=org.opencontainers.image.title=sf-landing' >/dev/null
          REMOTE_SCRIPT

      - name: Smoke test
        run: |
          set -euo pipefail
          # shellcheck disable=SC2029
          ssh -F /tmp/ssh_config landing \
            "ENV_NAME='$ENV_NAME' PORT='$WEB_PUBLISH_PORT' bash -euo pipefail -s" <<'REMOTE_SCRIPT'
          base="http://127.0.0.1:$PORT"

          for path in / /sitemap.xml /llms.txt /robots.txt; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$base$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "$path returned $code instead of 200" >&2; exit 1; }
          done

          robots=$(curl -sS --max-time 20 "$base/robots.txt")
          if [ "$ENV_NAME" = "production" ]; then
            # A production that takes itself out of the index is the most expensive mistake
            # this pipeline can make. So it gets checked.
            if printf '%s' "$robots" | grep -qE '^Disallow: /$'; then
              echo "robots.txt locks production out. NUXT_SITE_ENV wrong?" >&2
              exit 1
            fi
            # `|| locs=0`, because grep exits 1 without a match and pipefail would otherwise
            # abort the run right here without a message — instead of on the line below, which
            # explains why.
            locs=$(curl -sS --max-time 20 "$base/sitemap.xml" | grep -o '<loc>' | wc -l) || locs=0
            echo "sitemap: $locs entries"
            [ "$locs" -gt 0 ] || { echo "Sitemap is empty." >&2; exit 1; }
          else
            printf '%s' "$robots" | grep -qE '^Disallow: /$' \
              || { echo "robots.txt of $ENV_NAME does not lock. NUXT_SITE_ENV wrong?" >&2; exit 1; }
            echo "robots.txt: Disallow: / set"
            # The sitemap is deliberately empty here: nuxt-sitemap leaves out routes that are
            # set to noindex. That is why it is not counted for stage and dev.
          fi
          REMOTE_SCRIPT

      - name: Logs on failure
        if: failure()
        run: |
          # shellcheck disable=SC2029
          ssh -F /tmp/ssh_config landing \
            "DIR='$DIR' ENV_NAME='$ENV_NAME' bash -euo pipefail -s" <<'REMOTE_SCRIPT' || true
          cd "$DIR"
          COMPOSE="docker compose --env-file .env.$ENV_NAME -f docker-compose.prod.yml"
          $COMPOSE ps
          $COMPOSE logs --tail=200
          REMOTE_SCRIPT

      - name: Clean up
        if: always()
        run: |
          # Both with `|| true`: the registry login and the key belong cleaned up even when the
          # deploy failed, and no cleanup step should mask the actual error.
          ssh -F /tmp/ssh_config landing \
            "DOCKER_CONFIG='$REMOTE_DOCKER_CONFIG' docker logout ghcr.io" || true
          rm -f /tmp/deploy_key /tmp/deploy_known_hosts /tmp/ssh_config || true
