# Der Stack auf dem Server. Wird von .github/workflows/deploy.yml nach
# /opt/landing/<env>/ kopiert und dort mit `--env-file .env.<env>` gestartet.
#
# Alles Umgebungsabhängige kommt aus dieser env-Datei, nichts steht hier fest. Dieselben
# Variablennamen wie im Booking-Stack (STACK_SUFFIX, IMAGE_TAG, GHCR_OWNER, WEB_PUBLISH_PORT),
# damit beide Stacks auf derselben Maschine gleich zu bedienen sind.
#
# STACK_SUFFIX muss *in* der env-Datei stehen, nicht bloß exportiert sein: compose löst ${…}
# im Projektnamen aus --env-file auf, nicht aus der Shell.
#
#     docker compose --env-file .env.stage -f docker-compose.prod.yml up -d --wait

name: shape-and-flow-landing-${STACK_SUFFIX:-production}

services:
  web:
    # Die :?-Form statt eines stillen Leerstrings: fehlt die env-Datei oder ein Eintrag darin,
    # hieße das Image sonst `ghcr.io//sf-landing:` und der Fehler käme erst beim pull, getarnt
    # als Registry-Problem.
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER fehlt in der env-Datei}/sf-landing:${IMAGE_TAG:?IMAGE_TAG fehlt in der env-Datei}
    container_name: sf-landing-${STACK_SUFFIX:-production}
    restart: unless-stopped
    ports:
      # Das 127.0.0.1: davor ist nicht optional. Docker schreibt für veröffentlichte Ports
      # eigene iptables-Regeln, die an ufw vorbeigehen — ohne die Bindung an das Loopback-
      # Interface stünde der Port offen im Internet. Der Host-nginx ist der einzige Weg herein.
      - '127.0.0.1:${WEB_PUBLISH_PORT:-8090}:3000'
    environment:
      # Nur die Namen, keine Werte: so kommen die Zugangsdaten des Postausgangsservers aus der
      # env-Datei auf dem Server und stehen nicht im Repository. Ohne sie startet der Container
      # trotzdem — das Kontaktformular antwortet dann mit einem Hinweis auf die E-Mail-Adresse,
      # statt Anfragen still zu verschlucken.
      - NUXT_SMTP_HOST
      - NUXT_SMTP_PORT
      - NUXT_SMTP_USER
      - NUXT_SMTP_PASSWORD
      - NUXT_SMTP_ABSENDER
      - NUXT_SMTP_EMPFAENGER
      # Backend und Browser nutzen getrennte, auf genau ein Unleash-Environment begrenzte
      # Tokens. Der Frontend-Token ist absichtlich browserlesbar; der Backend-Token bleibt
      # ausschließlich in der mode-600-Env-Datei und im Container.
      - NUXT_UNLEASH_URL
      - NUXT_UNLEASH_BACKEND_TOKEN
      - NUXT_UNLEASH_ENVIRONMENT
      - NUXT_UNLEASH_DEPLOYMENT
      - NUXT_PUBLIC_UNLEASH_URL
      - NUXT_PUBLIC_UNLEASH_FRONTEND_TOKEN
      - NUXT_PUBLIC_UNLEASH_ENVIRONMENT
      - NUXT_PUBLIC_UNLEASH_DEPLOYMENT
    logging:
      # Ohne Grenze wächst die JSON-Logdatei bis die Platte voll ist.
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
